<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研文献本地化管理系统 2.3（v1.5 增强 · v1.6 上传入库）</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1f2733; --muted:#6b7686;
  --line:#e6eaf2; --primary:#3b5bdb; --primary-soft:#eef1fe;
  --paper:#3b5bdb; --author:#f08c00; --keyword:#2f9e44; --venue:#7048e8;
  --org:#e03131; --local:#868e96;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.6}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.topbar h1{font-size:22px;margin:0;letter-spacing:.3px}
.badge{font-size:12px;color:var(--muted);background:#eef1f6;border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:transparent;color:var(--muted);font-size:14px;padding:10px 16px;cursor:pointer;
  border-bottom:2px solid transparent;border-radius:8px 8px 0 0;transition:.15s}
.tab:hover{color:var(--primary);background:var(--primary-soft)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card .num{font-size:30px;font-weight:700;line-height:1.1}
.card .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.card .sub2{font-size:11px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bcol{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bcol .val{font-size:12px;color:var(--muted);margin-bottom:4px}
.bcol .bar{width:100%;max-width:44px;background:linear-gradient(180deg,#5c7cfa,#3b5bdb);border-radius:6px 6px 2px 2px;transition:height .4s}
.bcol .bar.zero{background:#dde3ee}
.bcol .yr{font-size:12px;color:var(--muted);margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.inp{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
  box-shadow:var(--shadow);transition:.15s}
.item:hover{border-color:var(--primary);transform:translateY(-1px)}
.item.long{flex:1 1 calc(50% - 12px);min-width:300px}
.item h4{margin:0 0 4px;font-size:14px}
.item .meta{font-size:12px;color:var(--muted)}
.item .meta b{color:var(--primary);font-weight:600}
.detail{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--ink)}
.detail.open{display:block}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px;margin:8px 0}
.dl .k{color:var(--muted);font-size:12px}
.dl .v{word-break:break-all}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.kw{background:#ebfbee;color:#2b8a3e}
.tag.org{background:#fff5f5;color:#c92a2a}
.note{font-size:12px;color:var(--muted);background:#f8f9fc;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
.cloud{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;line-height:1.4}
.cloud span{cursor:default;padding:2px 8px;border-radius:8px;transition:.15s}
.cloud span:hover{background:var(--primary-soft)}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:12px;margin:4px 6px 0 0;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center}
/* 图谱 */
#gwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#fbfcfe,#f4f6fb)}
#gsvg{width:100%;height:600px;display:block;background:transparent}
.glegend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;align-items:center}
.glegend label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.gdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.gfocus{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;font-size:12px;color:var(--muted)}
.lnk{stroke-width:1.2;fill:none;opacity:.65}
.lnk.hasauthor{stroke:#f0a24c}
.lnk.haskeyword{stroke:#69c07d}
.lnk.publishedin{stroke:#9775fa}
.lnk.cites{stroke:#a8b3c6}
.lnk.hasaffiliation{stroke:#f08b8b}
.lnk.related_to{stroke:#9aa4b2}
.ndef{stroke:#fff;stroke-width:2;cursor:pointer}
.ndef:hover{stroke:var(--primary)}
.ndef.paper{fill:#4c6ef5}
.ndef.author{fill:#f08c00}
.ndef.keyword{fill:#2f9e44}
.ndef.venue{fill:#7048e8}
.ndef.organization{fill:#e03131}
.ndef.localfile{fill:#adb5bd}
.ntext{font-size:10px;fill:#374151;pointer-events:none}
.tooltip{position:fixed;background:rgba(20,26,38,.92);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:99;display:none}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

function bindTabs(){
  const btns = $('tabs').querySelectorAll('.tab');

    btns.forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    $('view-' + b.dataset.v).classList.add('on');
    if(b.dataset.v === 'graph') layoutGraph();
  }));
}

function yearPanel(){
  const yd = DATA.yearDist.slice().sort((a,b)=>a[0]-b[0]);
  const max = Math.max(...yd.map(x=>x[1]), 1);
  return `<div class="panel"><h3>年份分布（${DATA.stats.paper} 篇）</h3>
    <div class="bars">${yd.map(([y,c]) => `
      <div class="bcol"><div class="val">${c}</div>
      <div class="bar ${c===0?'zero':''}" style="height:${Math.round(c/max*110)}px"></div>
      <div class="yr">${y}</div></div>`).join('')}
    </div></div>`;
}

function typePanel(){
  const td = DATA.typeDist;
  const total = td.reduce((a,x)=>a+x[1],0);
  const rows = td.map(([k,c]) => {
    const pct = Math.round(c/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <span style="width:110px;color:var(--muted)">${esc(k)}</span>
      <div style="flex:1;background:#eef1f6;border-radius:8px;height:14px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#5c7cfa,#3b5bdb)"></div></div>
      <span style="width:60px;text-align:right;color:var(--muted)">${c} (${pct}%)</span></div>`;
  }).join('');
  return `<div class="panel"><h3>文献类型分布</h3>${rows}
    <div class="note">当前语料仅含"期刊论文"类型；会议论文/学位论文/技术报告/预印本等枚举类型暂无实例（按实际数据渲染）。</div>

}

    <div class="hint" id="pcount"></div>`;
  $('pq').addEventListener('input', e => {paperFilter.q=e.target.value.trim().toLowerCase(); listPapers();});
  $('pv').addEventListener('change', e => {paperFilter.venue=e.target.value; listPapers();});
  $('pk').addEventListener('change', e => {paperFilter.kw=e.target.value; listPapers();});

function listPapers(){
  const f = paperFilter;
  let list = DATA.papers.slice();
  if(f.q){
    const q = f.q;
    list = list.filter(p => {
      const hay = [p.title, p.venue, p.doi, p.paperType, ...p.keywords, ...p.authors.map(a=>a.name)]
        .join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(f.venue) list = list.filter(p => p.venue === f.venue);
  if(f.kw) list = list.filter(p => p.keywords.includes(f.kw));
  list.sort((a,b)=> (b.year||'').localeCompare(a.year||''));
  $('pcount').textContent = `共 ${list.length} / ${DATA.stats.paper} 篇文献`;
  $('plist').innerHTML = list.length === 0 ? '<div class="empty">无匹配文献</div>' :
    list.map(p => paperCard(p)).join('');
}

  return `<div class="item long">

}
function yearOf(pid){

/* ---------- 关联图谱视图 ---------- */
let gdata = null, gsim = null, gfocus = [];

function initGraph(){
  $('view-graph').innerHTML = `
    <div class="toolbar">
      <input id="gq" class="inp" list="gplist" placeholder="输入文献标题聚焦 1-hop 子图…">
      <datalist id="gplist">${DATA.papers.map(p=>`<option>${esc(p.title)}</option>`).join('')}</datalist>
      <button class="tab" id="gclear" style="border:1px solid var(--line);border-radius:10px">清除聚焦</button>
    </div>
    <div class="glegend">
      <span style="font-size:13px;color:var(--muted)">显示节点：</span>
      <label><span class="gdot" style="background:#4c6ef5"></span>文献</label>
      <label><span class="gdot" style="background:#f08c00"></span>作者</label>
      <label><span class="gdot" style="background:#2f9e44"></span>关键词</label>
      <label><span class="gdot" style="background:#7048e8"></span>期刊</label>
      <label><span class="gdot" style="background:#e03131"></span>机构</label>
      <label><span class="gdot" style="background:#adb5bd"></span>本地文件</label>
    </div>
    <div id="gwrap"><svg id="gsvg"></svg>
      <div class="gfocus" id="gstatus">全部节点</div></div>
    <div class="hint">提示：拖拽画布外可平移？— 本图为力导向自动布局；点击节点聚焦其 1-hop 邻居，点击画布空白处清除聚焦。边颜色见图例：
      <span style="color:#f0a24c">hasAuthor</span> /
      <span style="color:#69c07d">hasKeyword</span> /
      <span style="color:#9775fa">publishedIn</span> /
      <span style="color:#a8b3c6">cites</span> /
      <span style="color:#f08b8b">hasAffiliation</span> /
      <span style="color:#9aa4b2">related_to</span></div>`;
  $('gq').addEventListener('input', onGraphQuery);
  $('gclear').addEventListener('click', () => { $('gq').value=''; clearFocus(); });
  $('gsvg').addEventListener('click', e => { if(e.target.tagName==='svg') clearFocus(); });
  buildGraph();
}

function buildGraph(){
  const byId = {};
  DATA.graph.nodes.forEach(n => byId[n.id] = n);
  const edges = DATA.graph.edges.map(e => ({...e}));
  gdata = {byId, edges};
}

function onGraphQuery(e){
  const q = e.target.value.trim();
  if(!q) return clearFocus();
  const hit = DATA.papers.find(p => p.title.toLowerCase().includes(q.toLowerCase()));
  if(hit) focusNode(hit.id);
}

function nodeName(id){
  const n = gdata.byId[id];
  return n ? n.name : id.split('#').pop();
}

function focusNode(id){
  const n = gdata.byId[id];
  if(!n) return;
  const neigh = new Set([id]);
  gdata.edges.forEach(e => {
    if(e.s===id) neigh.add(e.t);
    if(e.t===id) neigh.add(e.s);
  });
  gfocus = [...neigh];
  layoutGraph();
  $('gstatus').textContent = `聚焦：${n.name}（${gfocus.length} 节点）`;
}

function clearFocus(){
  gfocus = [];
  layoutGraph();
  $('gstatus').textContent = '全部节点';
}

function layoutGraph(){
  const W = 1140, H = 600;
  const byId = gdata.byId;
  const pool = gfocus.length ? gfocus.filter(id=>byId[id]) : Object.keys(byId);
  const nodeSet = new Set(pool);
  // 相邻边
  const edges = gdata.edges.filter(e => nodeSet.has(e.s) && nodeSet.has(e.t));
  const nodes = pool.map(id => {
    const n = byId[id];
    return {id, type:n.type, name:n.name, x: Math.random()*W, y: Math.random()*H, vx:0, vy:0};
  });
  const nMap = {};
  nodes.forEach(n => nMap[n.id] = n);
  // 力导向迭代
  const k = Math.sqrt(W*H / Math.max(nodes.length,1)) * 1.4;
  for(let iter=0; iter<260; iter++){
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let d2 = dx*dx+dy*dy || 1;
        let d = Math.sqrt(d2);
        let f = k*k/d2;
        if(d > k*2.2) f = -k*0.4/d;   // 过远轻微吸引
        dx/=d; dy/=d;
        a.vx += dx*f*0.06; a.vy += dy*f*0.06;
        b.vx -= dx*f*0.06; b.vy -= dy*f*0.06;
      }
      a.vx += (W/2 - a.x)*0.002; a.vy += (H/2 - a.y)*0.002;
    }
    for(const e of edges){
      const a = nMap[e.s], b = nMap[e.t];
      if(!a||!b) continue;
      let dx = b.x-a.x, dy = b.y-a.y;
      let d = Math.sqrt(dx*dx+dy*dy) || 1;
      const rest = (a.type===e.type==='hasAuthor') ? 90 : 70;
      let pull = (d-rest)*0.05;
      dx/=d; dy/=d;
      a.vx += dx*pull; a.vy += dy*pull;
      b.vx -= dx*pull; b.vy -= dy*pull;
    }
    nodes.forEach(n => { n.x += n.vx; n.y += n.vy; n.x = Math.max(16, Math.min(W-16, n.x)); n.y = Math.max(16, Math.min(H-16, n.y)); n.vx*=0.78; n.vy*=0.78; });
  }
  renderGraph(nodes, edges, byId);
}

function renderGraph(nodes, edges, byId){
  const svg = $('gsvg');
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const W = 1140, H = 600;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const show = 1; // 全部类型可显示
  // 边
  edges.forEach(e => {
    const a = byId[e.s], b = byId[e.t];
    if(!a||!b) return;
    const line = document.createElementNS(NS,'line');
    const n1 = nodes.find(n=>n.id===e.s), n2 = nodes.find(n=>n.id===e.t);
    line.setAttribute('x1',n1.x); line.setAttribute('y1',n1.y);
    line.setAttribute('x2',n2.x); line.setAttribute('y2',n2.y);
    line.setAttribute('class','lnk '+typeClass(e.type));
    const isAuthorLink = e.type==='hasAuthor';
    if(isAuthorLink){ line.setAttribute('stroke-width','1.6'); line.setAttribute('opacity','0.7'); }
    svg.appendChild(line);
  });
  // 节点
  nodes.forEach(n => {
    const g = document.createElementNS(NS,'g');
    const r = n.type==='Paper' ? 9 : (n.type==='Author' ? 7 : 5);
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',r);
    c.setAttribute('class','ndef '+typeClass(n.type));
    g.appendChild(c);
    if(gfocus.length){
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x',n.x+r+4); t.setAttribute('y',n.y+3);
      t.setAttribute('class','ntext');
      t.textContent = n.name.slice(0,28) + (n.name.length>28?'…':'');
      g.appendChild(t);
    }
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if(gfocus.length && gfocus.includes(n.id)) return;
      focusNode(n.id);
    });
    g.addEventListener('mousemove', ev => {
      const tp = $('tooltip');
      tp.style.display='block';
      tp.style.left = (ev.clientX + 14) + 'px';
      tp.style.top = (ev.clientY + 14) + 'px';
      tp.textContent = `${n.name}（${typeLabel(n.type)}）`;
    });
    g.addEventListener('mouseleave', () => $('tooltip').style.display='none');
    svg.appendChild(g);
  });
}

function typeClass(t){ return t.toLowerCase(); }
function typeLabel(t){ return {Paper:'文献',Author:'作者',Keyword:'关键词',Venue:'期刊',Organization:'机构',LocalFile:'本地文件'}[t] || t; }

document.addEventListener('click', e => {
  const tp = $('tooltip');
  if(tp) tp.style.display='none';
});

</script>

<footer style="text-align:center;color:#aab4c4;font-size:12px;margin-top:40px">科研学术本体 v1 · 基于 scholar_literature_graph_v2_4.json（v1.5 LLM 增强 · v1.6 上传 PDF 自动入库）自适应生成 · 本地化单文件页面</footer>
</div>

<script>
/* ================= v1.6 上传入库面板 ================= */
(() => {
  const VID = 'view-upload';
  function $id(x){ return document.getElementById(x); }

  function escHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ------- file:// 下仅展示命令指引，不报错 ------- */
  function isFileProto(){ return location.protocol === 'file:'; }

  function renderFileGuidance(){
    const el = $id(VID);
    if(!el) return;
    el.innerHTML = '<div class="panel"><h3>上传 PDF 自动入库（v1.6）</h3>'
      + '<div class="note" style="line-height:1.9">'
      + '当前以 <code>file://</code> 方式直接打开页面，无法调用上传接口。'
      + '请先启动本地服务后再刷新页面：'
      + '<br><br><code style="background:#eef2f7;padding:6px 10px;border-radius:6px;display:inline-block">'
      + 'cd ' + escHtml(DATA.pdfDir.split('论文')[0]) + ' && python3 tools/serve.py'
      + '</code>'
      + '<br><span class="muted" style="color:#aab4c4">然后浏览器访问 <code>http://localhost:9000</code>，'
      + '切到「上传入库」标签页即可上传本地 PDF 文献。</span>'
      + '</div></div>';
  }

  /* ------- 服务模式下：上传表单 + 结果 ------- */
  function renderUploadPanel(){
    const el = $id(VID);
    if(!el) return;
    el.innerHTML = '<div class="panel"><h3>上传 PDF 文献入库（v1.6 自动闭环）</h3>'
      + '<div class="note">上传本地 PDF 后，系统将自动完成：<b>解析元数据（标题/作者/年份/DOI/摘要）'
      + '→ 去重（DOI/标题/文件名）→ 本地 LLM 增强（qwen3:8b 生成 aiSummary/关键词/研究方向）'
      + '→ 本体实例化 → 增量写入 v2_4 图谱与 TTL → 即时重建页面</b>。</div>'
      + '<div id="up-drop" style="border:2px dashed #bac8ff;border-radius:12px;background:#f5f7ff;'
      + 'padding:34px 20px;text-align:center;margin:14px 0;cursor:pointer;color:#4263eb">'
      + '<div style="font-size:15px;font-weight:600">拖拽 PDF 文件到此处</div>'
      + '<div style="font-size:13px;color:#748ffc;margin-top:6px">或点击下方按钮选择文件（仅支持 .pdf）</div></div>'
      + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<button id="up-pick" style="padding:8px 16px;background:#4263eb;color:#fff;border:0;border-radius:8px;cursor:pointer">选择 PDF 文件…</button>'
      + '<input type="file" id="up-file" accept="application/pdf,.pdf" style="display:none">'
      + '<span id="up-name" style="color:#55607a;font-size:13px"></span></div>'
      + '<div id="up-status" style="margin-top:14px;line-height:1.8"></div></div>';

    const drop = $id('up-drop'), fileInput = $id('up-file'), nameSpan = $id('up-name');
    $id('up-pick').addEventListener('click', () => fileInput.click());
    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = '#4263eb'; });
    drop.addEventListener('dragleave', () => { drop.style.borderColor = '#bac8ff'; });
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.style.borderColor = '#bac8ff';
      if(e.dataTransfer.files && e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if(fileInput.files.length) uploadFile(fileInput.files[0]);
    });

    function uploadFile(file){
      nameSpan.textContent = '已选择：' + file.name + '（' + (file.size/1024/1024).toFixed(2) + ' MB）';
      const st = $id('up-status');
      st.innerHTML = '<div class="status loading">正在上传并入库，请稍候（本地 LLM 摘要生成约需数十秒）…</div>';
      const fd = new FormData();
      fd.append('file', file);
      fetch('/upload', {method:'POST', body:fd})
        .then(r => r.json())
        .then(res => {
          const color = (res.status === 'ingested') ? '#2f9e44'
                      : (res.status === 'duplicate') ? '#e8590c'
                      : '#e03131';
          const head = (res.status === 'ingested') ? '✅ 入库成功（新增文献）'
                     : (res.status === 'duplicate') ? '⏭ 已入库（去重命中，跳过新增）'
                     : (res.status === 'failed') ? '⚠ 入库失败'
                     : '处理完成';
          let tail = '';
          if(res.status === 'ingested'){
            tail = '<div style="margin-top:8px"><b style="color:#2f9e44">3 秒后自动刷新，'
                 + '新文献将在「文献」标签页与其他统计中可见。</b></div>'
                 + '<button id="up-reload" style="padding:6px 12px;border:1px solid #4263eb;'
                 + 'border-radius:6px;background:#fff;color:#4263eb;cursor:pointer;margin-right:8px">立即刷新</button>'
                 + '<button id="up-goto" style="padding:6px 12px;border:0;border-radius:6px;'
                 + 'background:#eef2ff;color:#4263eb;cursor:pointer">去「文献」标签页查看</button>';
            setTimeout(() => location.reload(), 3000);
          } else if(res.status === 'duplicate'){
            tail = '<div style="margin-top:6px;font-size:13px;color:#55607a">'
                 + '该 PDF 与库中已有文献重复（' + escHtml(res.reason || 'DOI/标题/文件名命中') + '），'
                 + '未重复入库，库体积不变。</div>';
          } else {
            tail = '<div style="margin-top:6px;font-size:13px;color:#55607a;white-space:pre-wrap;'
                 + 'max-height:180px;overflow:auto">' + escHtml(res.reason || res.detail || '未知原因：' + res.title) + '</div>';
          }
          st.innerHTML = '<div class="status" style="border:1px solid ' + color + ';color:' + color
            + ';background:#fff;padding:10px 12px;border-radius:8px">'
            + '<b>' + head + '</b>'
            + (res.title ? '<div style="margin-top:4px">文献：' + escHtml(res.title) + '</div>' : '')
            + '</div>' + tail;
          const rl = $id('up-reload'); if(rl) rl.addEventListener('click', () => location.reload());
          const gt = $id('up-goto'); if(gt) gt.addEventListener('click', () => {
            document.querySelector('#tabs .tab[data-v="papers"]').click();
          });
        })
        .catch(err => {
          st.innerHTML = '<div class="status" style="color:#e03131;border:1px solid #e03131;'
            + 'border-radius:8px;padding:10px 12px;background:#fff">上传请求失败：' + escHtml(String(err))
            + '<div style="margin-top:4px;font-size:13px">请确认已通过 <code>python3 tools/serve.py</code> '
            + '启动本地服务（file:// 直接打开无法上传）。</div></div>';
        });
    }
  }

  function initUpload(){
    if(isFileProto()){ renderFileGuidance(); return; }
    renderUploadPanel();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initUpload);
  else initUpload();
})();
</script>
